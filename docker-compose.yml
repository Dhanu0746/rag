services:

  # ── Streamlit Chat Application ────────────────────────────────────────────
  app:
    build: .
    container_name: rag-app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./eval_results:/app/eval_results
      - ./users.db:/app/users.db
    env_file:
      - .env
    command: streamlit run chat_app.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Eval / Observability Dashboard ───────────────────────────────────────
  dashboard:
    build: .
    container_name: rag-dashboard
    ports:
      - "8502:8502"
    volumes:
      - ./eval_results:/app/eval_results
      - ./data:/app/data
      - ./storage:/app/storage
    env_file:
      - .env
    command: streamlit run dashboard/app.py --server.port=8502 --server.address=0.0.0.0
    restart: unless-stopped
    depends_on:
      - app

  # ── Prometheus Metrics Exporter (FastAPI) ─────────────────────────────────
  metrics:
    build: .
    container_name: rag-metrics
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    env_file:
      - .env
    command: uvicorn src.metrics_exporter:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: rag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    restart: unless-stopped
    depends_on:
      - metrics

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: rag-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  grafana_data:

# ─────────────────────────────────────────────────────────────────────────────
# Quick Start:
#
#   1. Copy .env.example to .env and fill in your keys
#   2. docker compose up --build -d
#
# Services:
#   Chat App   → http://localhost:8501
#   Dashboard  → http://localhost:8502
#   Metrics    → http://localhost:8000/metrics
#   Prometheus → http://localhost:9090
#   Grafana    → http://localhost:3000  (admin / admin or GRAFANA_PASSWORD)
#
# LLM Options (set in .env):
#   Local  (default): LLM_PROVIDER=ollama  — requires Ollama running on host
#   Cloud  (deploy):  LLM_PROVIDER=groq    — set GROQ_API_KEY in .env
# ─────────────────────────────────────────────────────────────────────────────
