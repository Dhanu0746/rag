global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "rag-service"
    static_configs:
      # When running via Docker Compose, use the service name "metrics"
      # When running locally, use host.docker.internal:8000
      - targets: ["metrics:8000"]
    metrics_path: /metrics
